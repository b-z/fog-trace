<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fog Trace · Flights to Fog of World</title>
<meta name="description" content="Turn the flights you logged in Flighty into great-circle arcs on your Fog of World map: open the Flighty CSV export, get a snapshot the app can restore or merge. Runs in your browser; nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2350dc8c' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { color-scheme: dark; --bg: #0d0d0d; --panel: #141414; --line: #262626; --text: #ddd; --muted: #8a8a8a; --accent: #ffd34d; --track: #50dc8c; --err: #ff6b5b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; font: 14px/1.6 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  a { color: #7cc4ff; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #bar h1 { font-size: 15px; margin: 0; font-weight: 650; flex: 1 1 auto; white-space: nowrap; }
  .barbtn, .barsel { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: #1e1e1e; color: var(--text); text-decoration: none; cursor: pointer; white-space: nowrap; }
  .barbtn:hover { background: #262626; }
  .iconbtn { display: inline-flex; gap: 6px; align-items: center; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .intro { color: #bbb; margin: 4px 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  .btn { font: inherit; padding: 7px 16px; border-radius: 8px; border: 1px solid #333; background: #1f1f1f; color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover:not(:disabled) { background: #282828; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { border-color: #2f6b4b; color: var(--track); }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
  .warn { color: var(--accent); }
  .err:empty, .warn:empty, #summary:empty, #last:empty { display: none; }
  #summary, #last, .warn, .err { margin-top: 8px; }
  .opts label { display: block; margin: 6px 0; }
  .opts input[type=date], .opts input[type=text] { font: inherit; background: #1b1b1b; color: var(--text); border: 1px solid #333; border-radius: 6px; padding: 2px 6px; }
  .mode { margin: 10px 0; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .mode .muted { font-size: 13px; }
  #map { height: 340px; border-radius: 8px; margin: 12px 0; background: #111; }
  .tbl { max-height: 216px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; font-size: 12px; }
  .tbl:empty { display: none; }
  .tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tbl th { position: sticky; top: 0; background: #1a1a1a; color: var(--muted); font-weight: 500; text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 3px 8px; border-bottom: 1px solid #1c1c1c; white-space: nowrap; }
  .tbl td.num, .tbl th.num { text-align: right; }
  .tbl tbody tr { cursor: pointer; }
  .tbl tbody tr:hover { background: #1d1d1d; }
  .tbl tbody tr.sel { background: #2a2614; }
  .tbl .tag { color: var(--accent); margin-left: 4px; }
  .osm { filter: brightness(.55) saturate(.4); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  #fname { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  #prog { display: none; align-items: center; gap: 10px; margin-top: 10px; }
  #prog.on { display: flex; }
  #prog .bar { flex: 1; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  #prog .bar i { display: block; height: 100%; width: 0; background: var(--track); transition: width .2s; }
  #result { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  #r-info { display: block; margin-top: 6px; font-size: 13px; word-break: break-all; }
  ol { padding-left: 20px; }
  ol li { margin: 6px 0; }
  code { font-size: 12px; background: #1d1d1d; padding: 1px 4px; border-radius: 4px; }
  body.drag main { outline: 2px dashed var(--track); outline-offset: -6px; }
  @media (max-width: 560px) { main { padding: 12px; } #map { height: 260px; } }
</style>
</head>
<body>
<header id="bar">
  <h1 data-i18n="fl.title"></h1>
  <a class="barbtn" href="./" data-i18n="fl.back"></a>
  <select id="lang" class="barsel" data-i18n-title="bar.lang" data-i18n-aria="bar.lang"></select>
  <a class="barbtn iconbtn" href="https://github.com/b-z/fog-trace" target="_blank" rel="noopener" data-i18n-title="bar.github" data-i18n-aria="bar.github">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <span>GitHub</span></a>
</header>
<main>
  <p class="intro" data-i18n="fl.intro"></p>

  <section class="card">
    <div class="row">
      <button class="btn primary" id="b-pick" data-i18n="fl.pick"></button>
      <span class="muted" data-i18n="fl.drop"></span>
    </div>
    <div id="summary"></div>
    <div class="err" id="err"></div>
  </section>

  <section class="card opts" id="s-opts" hidden>
    <label><input type="checkbox" id="o-up"> <span data-i18n="fl.upcoming"></span></label>
    <div class="mode">
      <label><input type="radio" name="mode" value="all" checked> <b data-i18n="fl.modeAll"></b> <span class="muted">· <span data-i18n="fl.modeAllHint"></span></span></label>
      <label><input type="radio" name="mode" value="new"> <b data-i18n="fl.modeNew"></b> <input type="date" id="o-since"> <span class="muted">· <span data-i18n="fl.modeNewHint"></span></span></label>
      <div id="last" class="muted"></div>
      <div id="warn" class="warn"></div>
    </div>
    <div id="map"></div>
    <div class="row"><span id="count"></span></div>
    <div class="tbl" id="tbl"></div>
    <div class="row">
      <label style="margin:0"><span data-i18n="fl.prefix"></span> <input type="text" id="o-prefix" value="Flights" size="14" spellcheck="false" autocomplete="off"></label>
      <span id="fname" class="muted"></span>
    </div>
    <button class="btn primary" id="b-gen" data-i18n="fl.generate"></button>
    <div id="prog"><div class="bar"><i></i></div><span class="muted"></span></div>
    <div id="result" hidden>
      <a class="btn primary" id="r-dl" data-i18n="fl.download"></a>
      <button class="btn" id="r-share" hidden data-i18n="fl.share"></button>
      <span id="r-info" class="muted"></span>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="fl.how"></h2>
    <ol>
      <li data-i18n-html="fl.how1"></li>
      <li data-i18n-html="fl.how2"></li>
      <li data-i18n="fl.how3"></li>
      <li data-i18n-html="fl.how4"></li>
    </ol>
    <p class="muted" data-i18n-html="fl.about"></p>
    <p class="muted" data-i18n="fl.privacy"></p>
    <p class="muted" data-i18n="fl.disclaimer"></p>
  </section>
</main>
<input type="file" id="f" accept=".csv,text/csv" hidden>
<script src="src/i18n.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="src/fog-store.js"></script>
<script src="src/airports.js"></script>
<script src="src/flights-core.js"></script>
<script src="src/flights-page.js"></script>
</body>
</html>
